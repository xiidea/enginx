# The agent, for clusters that also serve the proxied traffic.
#
# Deploy this only on nodes that should serve proxied sites, selected by a label rather than by
# running everywhere: an agent on a node with no public address is a host the platform believes it
# can route traffic to and cannot.
#
#   kubectl label node <node> enginx.net/proxy=true
#
# Most estates will not use this at all. The agent's usual home is a virtual machine outside any
# cluster, from docker-compose.agent.yml — the platform manages hosts, and a host does not have to
# be a pod.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: enginx-agent
  namespace: enginx
  labels:
    app.kubernetes.io/name: enginx-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: enginx-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enginx-agent
    spec:
      nodeSelector:
        enginx.net/proxy: "true"

      # NGINX and the agent share a container by necessity, not by preference: the agent signals
      # the NGINX process to reload, and a process in another container cannot be signalled. That
      # is also what lets it restore the previous release when a reload fails.
      containers:
        - name: agent
          image: ghcr.io/xiidea/enginx-agent:0.1.0
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
            - name: https
              containerPort: 443
              hostPort: 443
            - name: mtls
              containerPort: 8443
              # Deliberately not a hostPort. The control port is reached through the Service
              # below, so it is not exposed on every node's public address as well.
          env:
            - name: AGENT_LISTEN_ADDR
              value: ":8443"
            # Loopback only: this probe is unauthenticated, which is only safe because nothing
            # off-pod can reach it.
            - name: AGENT_HEALTH_ADDR
              value: "127.0.0.1:9099"
            - name: AGENT_TLS_CERT
              value: /etc/enginx/pki/agent.crt
            - name: AGENT_TLS_KEY
              value: /etc/enginx/pki/agent.key
            - name: AGENT_CLIENT_CA
              value: /etc/enginx/pki/ca.crt
            # Only this common name may call, and only with a certificate signed by the CA above.
            # Both halves matter: the CA proves who issued it, the CN proves which client it is.
            - name: AGENT_CLIENT_CN
              value: enginx-management
            - name: AGENT_RELEASES_DIR
              value: /etc/nginx/enginx

          volumeMounts:
            - name: releases
              mountPath: /etc/nginx/enginx
            - name: pki
              mountPath: /etc/enginx/pki
              readOnly: true

          # Liveness asks only whether the agent is alive, and deliberately does not consult
          # NGINX. The agent stays up when NGINX will not start so a corrected bundle can be
          # deployed to it; a liveness probe that failed would restart the pod, the agent would
          # find the same broken configuration, and kubelet would destroy the only route to
          # repairing the host.
          livenessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:9099/agent/v1/health"]
            periodSeconds: 15
            failureThreshold: 3
          # Readiness asks whether this host is actually serving. Failing takes it out of any
          # Service that fronts it and shows in `kubectl get pods`, which is the reporting that
          # was missing — without restarting anything.
          readinessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:9099/agent/v1/ready"]
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests: { cpu: "200m", memory: "128Mi" }
            limits: { memory: "512Mi" }

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # What NGINX actually needs: bind 80 and 443, then drop to its worker user. Not the
              # rest of root's capabilities, and never privileged.
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "SETUID", "SETGID", "CHOWN"]

      volumes:
        - name: releases
          # Node-local and deliberately not an emptyDir: a pod restart must not lose the
          # configuration the host is serving. The agent restores from here on start.
          hostPath:
            path: /var/lib/enginx/releases
            type: DirectoryOrCreate
        - name: pki
          secret:
            secretName: enginx-agent-identity
            defaultMode: 0400

      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: enginx-agent
  namespace: enginx
spec:
  # Headless, so the management server addresses each agent individually. A load-balanced Service
  # would send a deployment intended for one host to whichever pod answered, which is the one
  # thing a per-host control plane must never do.
  clusterIP: None
  selector:
    app.kubernetes.io/name: enginx-agent
  ports:
    - name: mtls
      port: 8443
      targetPort: mtls
