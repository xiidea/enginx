apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: enginx
  labels:
    app.kubernetes.io/name: console
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: xiidea/enginx-console:latest
          ports:
            - name: http
              containerPort: 80
          env:
            # Written into config.js at container start, so one image serves every environment.
            - name: API_BASE
              value: https://enginx.example.com/api/v1
            - name: OIDC_AUTHORITY
              value: https://enginx.example.com/realms/enginx
            - name: OIDC_CLIENT_ID
              value: enginx-frontend
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "128Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: enginx
spec:
  selector:
    app.kubernetes.io/name: console
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enginx
  namespace: enginx
  annotations:
    # A deployment waits on a remote agent: validate, activate and reload all happen before the
    # response. The default 60s proxy timeout cuts that off mid-flight.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts: [enginx.example.com]
      secretName: enginx-tls
  rules:
    - host: enginx.example.com
      http:
        paths:
          # One hostname for API, console and Keycloak, so the browser holds a single OIDC session
          # without third-party cookie rules getting involved.
          - path: /api
            pathType: Prefix
            backend: { service: { name: proxy-management, port: { name: http } } }
          - path: /realms
            pathType: Prefix
            backend: { service: { name: keycloak, port: { number: 8080 } } }
          - path: /resources
            pathType: Prefix
            backend: { service: { name: keycloak, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: console, port: { name: http } } }

          # Deliberately absent: /actuator. Health and metrics are for in-cluster scrapers, not for
          # the public internet — publishing them discloses the estate's shape to anyone asking.
