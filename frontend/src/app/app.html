@if (auth.authenticated() && !auth.mustChangePassword()) {
  <div class="shell">
    <nav class="rail">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="name">Easy NGINX<br />Admin</span>
      </div>

      <ul class="nav">
        @for (item of navigation(); track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
          </li>
        }
      </ul>

      <div class="foot">
        <div class="who">
          <span class="avatar" aria-hidden="true">{{ auth.initials() }}</span>
          <span class="details">
            <span class="user">{{ auth.username() }}</span>
            <span class="roles">{{ roleLabel() }}</span>
          </span>
        </div>
        <div class="row">
          <button class="btn btn-sm" type="button" (click)="cycleTheme()">
            Theme: {{ theme() }}
          </button>
          <button class="btn btn-sm" type="button" (click)="auth.logout()">Sign out</button>
        </div>
        <span class="version">{{ versions() }}</span>
      </div>
    </nav>

    <main class="content">
      <router-outlet />
    </main>
  </div>
} @else if (auth.authenticated()) {
  <div class="signin">
    <app-password-change />
  </div>
} @else {
  <div class="signin">
    <app-sign-in />
  </div>
}

<app-toasts />
