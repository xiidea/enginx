<div class="card signin-card">
  <div class="card-body">
    <span class="mark large" aria-hidden="true"></span>
    <h1>Choose a new password</h1>
    <p class="muted">
      {{ username() }} is signed in with a password that has to be replaced before the account can
      be used.
    </p>

    <form class="signin-form" (ngSubmit)="submit()">
      <div class="field">
        <label for="pw-current">Current password</label>
        <input
          id="pw-current"
          name="currentPassword"
          type="password"
          autocomplete="current-password"
          autofocus
          [ngModel]="currentPassword()"
          (ngModelChange)="currentPassword.set($event)"
        />
      </div>
      <div class="field">
        <label for="pw-new">New password</label>
        <input
          id="pw-new"
          name="newPassword"
          type="password"
          autocomplete="new-password"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
        />
        <p class="hint">At least {{ minimumLength }} characters.</p>
      </div>
      <div class="field">
        <label for="pw-confirm">Repeat new password</label>
        <input
          id="pw-confirm"
          name="confirmation"
          type="password"
          autocomplete="new-password"
          [ngModel]="confirmation()"
          (ngModelChange)="confirmation.set($event)"
        />
        @if (confirmation() && confirmation() !== newPassword()) {
          <p class="field-error">The two entries do not match.</p>
        }
      </div>

      @if (error()) {
        <p class="field-error" role="alert">{{ error() }}</p>
      }

      <button class="btn btn-primary block" type="submit" [disabled]="submitting() || !valid()">
        {{ submitting() ? 'Saving…' : 'Change password' }}
      </button>
      <button class="btn block" type="button" (click)="signOut()">Sign out</button>
    </form>
  </div>
</div>
