# Security headers are repeated in every location that sets any header of its own.
#
# nginx does not merge add_header directives across levels: a child block containing even one
# add_header discards every inherited one. The SPA fallback makes this easy to get wrong, because
# try_files re-runs location matching for /index.html, so the request that looked like it matched
# `location /` is actually answered by `location = /index.html`.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Single-page app: unknown paths are routes, not missing files, so they fall through to the
    # shell rather than 404ing. The router then renders a real not-found page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached indefinitely.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # index.html must never be cached: it names the hashed bundles, so a stale copy pins the
    # application to a version that may no longer exist. config.js likewise, since it carries the
    # environment's issuer and API base.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
