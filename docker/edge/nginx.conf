# The public entry point for the management plane.
#
# One hostname serves three things: the console at /, the API at /api/, and Keycloak at /realms/
# and /resources/. Putting them on one origin is what lets the browser hold a single OIDC session
# without third-party cookie rules getting involved, and it means exactly one certificate and one
# published port for the whole plane.
#
# This proxies the *management* plane. It is not the NGINX that serves managed sites — those run
# the agent, on their own hosts, and are configured by this platform rather than by hand.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    # A global limit, in front of every replica. The in-process limiter is per instance and keyed
    # by authenticated subject; this one is keyed by address and catches what that cannot — a
    # flood arriving without a valid token at all, which would otherwise reach the JWT decoder.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conns:10m;

    # Terminating TLS here means the services behind speak plain HTTP on a private network and
    # never have to be restarted for a certificate renewal.
    upstream console      { server console:80;             keepalive 16; }
    upstream management   { server proxy-management:8080;  keepalive 16; }
    upstream identity     { server keycloak:8080;          keepalive 16; }

    # Everything arriving on 80 is redirected, with one exception: the ACME challenge path, so
    # this edge can renew its own certificate without being taken down first.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Two years, including subdomains. Long enough to be meaningful; note that it cannot be
        # unsaid quickly, so it belongs only on a hostname committed to HTTPS.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        limit_conn conns 64;
        client_max_body_size 2m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # The management API. `forward-headers-strategy: framework` on the Spring side is what
        # makes the headers above become the request's real scheme and host, so redirects and
        # Location headers come back as https rather than as the internal http URL.
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://management;
            # A deployment waits on a remote agent: validate, activate and reload all happen
            # before the response. The default 60s read timeout cuts that off mid-flight.
            proxy_read_timeout 120s;
        }

        # Documentation, on the same origin so its "try it" calls carry the session.
        location ~ ^/(swagger-ui|v3/api-docs) {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://management;
        }

        # Deliberately not proxied: /actuator. Health and metrics are for the internal network and
        # for a scraper on it, not for the public internet. Exposing them here would publish the
        # estate's shape — instance counts, certificate expiry, outbox depth — to anyone asking.

        # Keycloak. The login flow and its assets only; the admin console and its API stay
        # internal, reachable through an SSH tunnel or a bastion when they are needed.
        location ~ ^/(realms|resources|js)/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://identity;
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://console;
        }
    }
}
